<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bolha Níveis</title>
    <style>
        /* ====== TODO O CSS ANTERIOR ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #0b1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            padding: 12px;
            margin: 0;
        }

        #app {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 14px 14px 18px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
        }

        #stats {
            display: flex;
            justify-content: flex-start;
            padding: 0 4px 10px 4px;
        }

        .stat-item {
            font-size: 18px;
            font-weight: 700;
            color: #e8f0fe;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-item .icon {
            font-size: 20px;
        }

        .stat-item .value {
            min-width: 28px;
            text-align: center;
        }

        .stat-item.score .value {
            color: #ffd866;
        }

        #gameArea {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 24px;
            overflow: hidden;
            background: #1a2f44;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6), 0 8px 32px rgba(0, 0, 0, 0.4);
            touch-action: none;
        }

        #gameArea .bg-overlay {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 0;
        }

        #gameArea .bg-overlay.loaded {
            opacity: 0.7;
        }

        #gameArea .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .bg-loading {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1a2f44 30%, #2a4a66 60%, #1a2f44 90%);
            background-size: 200% 200%;
            animation: shimmer 2s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 100% 100%;
            }
        }

        /* ---- BUBBLES ---- */
        .bubble-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        .bubble-wrapper .ghost {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            opacity: 0.5;
            transition: border-color 0.3s ease;
            z-index: 0;
            width: 90px;
            height: 90px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .bubble-wrapper .ghost.nv1-ghost {
            border-color: rgba(79, 195, 247, 0.7);
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.10);
        }

        .bubble-wrapper .ghost.nv2-ghost {
            border-color: rgba(129, 199, 132, 0.7);
            box-shadow: 0 0 30px rgba(129, 199, 132, 0.10);
        }

        .bubble-wrapper .ghost.nv3-ghost {
            border-color: rgba(255, 213, 79, 0.7);
            box-shadow: 0 0 30px rgba(255, 213, 79, 0.10);
        }

        .bubble {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: pointer;
            touch-action: none;
            will-change: transform, width, height;
            z-index: 1;
            transition: box-shadow 0.15s ease;
            background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.01) 80%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset -4px -4px 16px rgba(0, 0, 0, 0.12), inset 4px 4px 16px rgba(255, 255, 255, 0.2), 0 6px 24px rgba(0, 0, 0, 0.25);
            pointer-events: auto;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 16%;
            width: 30%;
            height: 20%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 80%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            filter: blur(1px);
        }

        .bubble.nv1 {
            border-color: rgba(79, 195, 247, 0.7);
            box-shadow: inset -4px -4px 16px rgba(0, 0, 0, 0.12), inset 4px 4px 16px rgba(255, 255, 255, 0.2), 0 6px 24px rgba(0, 0, 0, 0.25), 0 0 40px rgba(79, 195, 247, 0.10);
        }

        .bubble.nv2 {
            border-color: rgba(129, 199, 132, 0.7);
            box-shadow: inset -4px -4px 16px rgba(0, 0, 0, 0.12), inset 4px 4px 16px rgba(255, 255, 255, 0.2), 0 6px 24px rgba(0, 0, 0, 0.25), 0 0 40px rgba(129, 199, 132, 0.10);
        }

        .bubble.nv3 {
            border-color: rgba(255, 213, 79, 0.7);
            box-shadow: inset -4px -4px 16px rgba(0, 0, 0, 0.12), inset 4px 4px 16px rgba(255, 255, 255, 0.2), 0 6px 24px rgba(0, 0, 0, 0.25), 0 0 40px rgba(255, 213, 79, 0.12);
        }

        .bubble:active {
            transform: translate(-50%, -50%) scale(0.85);
            transition: transform 0.06s ease;
        }

        @keyframes popBubble {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            40% {
                transform: translate(-50%, -50%) scale(1.35);
                opacity: 0.6;
            }

            100% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
        }

        .bubble.popping {
            animation: popBubble 0.22s ease-out forwards;
            pointer-events: none;
        }

        @keyframes burstBubble {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.9;
            }

            100% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
            }
        }

        .bubble.bursting {
            animation: burstBubble 0.3s ease-in forwards;
            pointer-events: none;
        }

        /* ---- POPUPS ---- */
        .bubble-popup {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
            animation: popupFloat 0.8s ease-out forwards;
            font-family: 'Segoe UI', system-ui, sans-serif;
            letter-spacing: 0.5px;
            transform: translate(-50%, -50%);
        }

        .bubble-popup.p1 {
            color: #4FC3F7;
        }

        .bubble-popup.p2 {
            color: #81C784;
        }

        .bubble-popup.p3 {
            color: #FFD54F;
        }

        .bubble-popup.lost-heart {
            color: #ef9a9a;
            font-size: 30px;
        }

        @keyframes popupFloat {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -80%) scale(1.3);
            }
        }

        /* ---- PROGRESS BAR ---- */
        #progressSection {
            margin-top: 14px;
            padding: 0 2px;
        }

        #progressHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        #progressHeader .level-badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 0 14px;
            border-radius: 12px;
            font-size: 13px;
            color: #ffd866;
        }

        #progressHeader .progress-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            gap: 12px;
        }

        #progressHeader .progress-text .hits-text {
            color: #81C784;
        }

        #progressHeader .progress-text .misses-text {
            color: #ef9a9a;
        }

        #progressHeader .progress-text span {
            font-weight: 700;
        }

        #progressBarWrap {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        #progressMisses {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef5350, #ef9a9a);
            border-radius: 20px;
            transition: width 0.25s ease;
            opacity: 0.85;
            z-index: 1;
        }

        #progressHits {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #66BB6A, #A5D6A7);
            border-radius: 20px;
            transition: width 0.25s ease;
            opacity: 0.75;
            box-shadow: 0 0 20px rgba(102, 187, 106, 0.15);
            z-index: 2;
        }

        #progressMisses.front {
            z-index: 3;
        }

        #progressHits.front {
            z-index: 3;
        }

        #progressDivider {
            position: absolute;
            left: 50%;
            top: 0;
            height: 100%;
            width: 2px;
            background: rgba(255, 255, 255, 0.15);
            z-index: 4;
            pointer-events: none;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        #progressLimitMarker {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 2px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 4;
            pointer-events: none;
            border-radius: 2px;
        }

        /* ---- OVERLAYS ---- */
        #loadingOverlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            color: #fff;
            padding: 30px;
            text-align: center;
            transition: opacity 0.6s ease;
        }

        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loadingOverlay .loader {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #4FC3F7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loadingOverlay .load-title {
            font-size: 22px;
            font-weight: 700;
            color: #e8f0fe;
        }

        #startOverlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            color: #fff;
            padding: 30px;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        #startOverlay.show {
            display: flex;
        }

        #startOverlay .title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #4FC3F7, #FFD54F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #startOverlay .sub {
            font-size: 16px;
            opacity: 0.6;
            margin-bottom: 24px;
        }

        #startBtn {
            padding: 14px 48px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #4FC3F7, #29B6F6);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 24px rgba(79, 195, 247, 0.3);
            touch-action: manipulation;
            margin-top: 8px;
        }

        #startBtn:active {
            transform: scale(0.94);
        }

        /* Tela de nome e ranking */
        #nameOverlay {
            position: absolute;
            inset: 0;
            z-index: 40;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            color: #fff;
            padding: 30px;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        #nameOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #nameOverlay h2 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #4FC3F7, #FFD54F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #nameOverlay .sub {
            font-size: 16px;
            opacity: 0.6;
            margin-bottom: 20px;
        }

        #nameOverlay input {
            width: 80%;
            max-width: 280px;
            padding: 12px 18px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        #nameOverlay input:focus {
            border-color: #4FC3F7;
        }

        #nameOverlay .name-btn {
            margin-top: 16px;
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #4FC3F7, #29B6F6);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 24px rgba(79, 195, 247, 0.3);
            touch-action: manipulation;
        }

        #nameOverlay .name-btn:active {
            transform: scale(0.94);
        }

        #nameOverlay .name-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        #nameError {
            color: #ef9a9a;
            font-size: 14px;
            margin-top: 8px;
            min-height: 24px;
        }

        /* Ranking dentro do jogo (área pequena) */
        #rankingArea {
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 8px 12px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        #rankingArea.show {
            display: block;
        }

        #rankingArea .rank-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 2px 0;
            color: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        #rankingArea .rank-item .pos {
            color: #ffd866;
            font-weight: 600;
            min-width: 30px;
        }

        #rankingArea .rank-item .name {
            flex: 1;
            text-align: left;
            margin-left: 8px;
        }

        #rankingArea .rank-item .score {
            font-weight: 600;
            color: #e8f0fe;
        }

        #rankingArea .rank-item.self {
            background: rgba(79, 195, 247, 0.15);
            border-radius: 4px;
        }

        #gameOverlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            color: #fff;
            padding: 30px;
            text-align: center;
        }

        #gameOverlay.show {
            display: flex;
        }

        #gameOverlay h2 {
            font-size: 32px;
            margin-bottom: 4px;
        }

        #gameOverlay h2.win {
            color: #81C784;
        }

        #gameOverlay h2.lose {
            color: #ef9a9a;
        }

        #gameOverlay .sub-text {
            font-size: 16px;
            opacity: 0.6;
            margin-bottom: 6px;
        }

        #gameOverlay .final-score {
            font-size: 56px;
            font-weight: 900;
            color: #ffd866;
            margin: 8px 0;
        }

        #gameOverlay .final-detail {
            font-size: 18px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        #gameOverlay .final-detail .hits {
            color: #81C784;
        }

        #gameOverlay .final-detail .misses {
            color: #ef9a9a;
        }

        #gameOverlay .record-info {
            font-size: 16px;
            margin-top: 8px;
            color: #ffd866;
        }

        #gameOverlay .pos-info {
            font-size: 14px;
            opacity: 0.6;
        }

        #restartBtn {
            margin-top: 18px;
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #4FC3F7, #29B6F6);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 24px rgba(79, 195, 247, 0.3);
            touch-action: manipulation;
        }

        #restartBtn:active {
            transform: scale(0.94);
        }

        @media (max-width:480px) {
            #app {
                padding: 10px 10px 14px;
                border-radius: 24px;
            }

            .stat-item {
                font-size: 14px;
                padding: 3px 12px;
            }

            .stat-item .icon {
                font-size: 16px;
            }

            .bubble-popup {
                font-size: 20px;
            }

            .bubble-popup.lost-heart {
                font-size: 24px;
            }

            #progressHeader {
                font-size: 12px;
            }

            #progressHeader .level-badge {
                font-size: 11px;
                padding: 0 10px;
            }

            #gameOverlay h2 {
                font-size: 26px;
            }

            #gameOverlay .final-score {
                font-size: 40px;
            }

            #restartBtn {
                padding: 10px 30px;
                font-size: 16px;
            }

            #progressBarWrap {
                height: 12px;
            }

            #startOverlay .title {
                font-size: 28px;
            }

            #startBtn {
                padding: 12px 36px;
                font-size: 17px;
            }

            #loadingOverlay .load-title {
                font-size: 18px;
            }

            #nameOverlay h2 {
                font-size: 22px;
            }

            #nameOverlay input {
                font-size: 16px;
                padding: 10px 14px;
            }
        }

        @media (max-width:380px) {
            .stat-item {
                font-size: 12px;
                padding: 2px 8px;
            }

            .stat-item .icon {
                font-size: 13px;
            }

            .bubble-popup {
                font-size: 17px;
            }

            .bubble-popup.lost-heart {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="stats">
            <div class="stat-item score">
                <span class="icon">⭐</span>
                <span class="value" id="scoreDisplay">0</span>
            </div>
        </div>

        <div id="gameArea">
            <div class="bg-loading" id="bgLoading"></div>
            <div class="bg-overlay" id="bgOverlay"></div>
            <div class="vignette"></div>

            <!-- Loading -->
            <div id="loadingOverlay">
                <div class="loader"></div>
                <div class="load-title">Carregando...</div>
            </div>

            <!-- Tela de nome -->
            <div id="nameOverlay">
                <h2>🫧 Bolha Níveis</h2>
                <div class="sub">Digite seu apelido para jogar</div>
                <input type="text" id="nameInput" placeholder="Seu nome" maxlength="20" autocomplete="off" />
                <div id="nameError"></div>
                <button class="name-btn" id="nameBtn">▶ Jogar</button>
                <div style="margin-top:16px; width:100%; max-width:300px;">
                    <div id="rankingArea" class="show">
                        <!-- será preenchido -->
                    </div>
                </div>
            </div>

            <!-- Start Overlay (antigo) -->
            <div id="startOverlay">
                <div class="title">🫧 Bolha Níveis</div>
                <div class="sub">Clique nas bolhas antes que cresçam demais</div>
                <button id="startBtn">▶ Iniciar Jogo</button>
            </div>

            <!-- Game Over -->
            <div id="gameOverlay">
                <h2 id="resultTitle">💥 Fim de Jogo</h2>
                <div class="sub-text">Pontuação final</div>
                <div class="final-score" id="finalScore">0</div>
                <div class="final-detail">✅ Acertos: <span class="hits" id="finalHits">0</span></div>
                <div class="final-detail">❌ Erros: <span class="misses" id="finalMisses">0</span></div>
                <div class="final-detail" id="finalEficiencia" style="display:none;">Eficiência: <span
                        id="eficienciaValue">0</span>%</div>
                <div class="record-info" id="recordInfo"></div>
                <div class="pos-info" id="posInfo"></div>
                <button id="restartBtn">🔄 Jogar Novamente</button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div id="progressSection">
            <div id="progressHeader">
                <span class="level-badge" id="levelBadge">Nível 1</span>
                <span class="progress-text">
                    <span class="hits-text">✅ <span id="hitsCount">0</span></span>
                    <span class="misses-text">❌ <span id="missesCount">0</span></span>
                    <span style="opacity:0.3;">|</span>
                    <span style="opacity:0.5;">limite <span id="limitDisplay">20</span></span>
                </span>
            </div>
            <div id="progressBarWrap">
                <div id="progressMisses" style="width:0%;"></div>
                <div id="progressHits" style="width:0%;"></div>
                <div id="progressDivider"></div>
                <div id="progressLimitMarker"></div>
            </div>
        </div>
    </div>

    <!-- ============= SUPABASE INTEGRATION ============= -->
    <script type="module">
        // ─── CONFIGURAÇÃO SUPABASE ──────────────────────────────────
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

        const SUPABASE_URL = 'https://wnpdwymxwgzjlzxlgeaq.supabase.co'
        const SUPABASE_ANON_KEY = 'sb_publishable_GRICL-VYHLeIv-X0-0MfhQ_Mhffn5jt'

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        // ─── ELEMENTOS DOM ──────────────────────────────────────────
        const gameArea = document.getElementById('gameArea');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const progressMisses = document.getElementById('progressMisses');
        const progressHits = document.getElementById('progressHits');
        const hitsCount = document.getElementById('hitsCount');
        const missesCount = document.getElementById('missesCount');
        const limitDisplay = document.getElementById('limitDisplay');
        const levelBadge = document.getElementById('levelBadge');
        const bgOverlay = document.getElementById('bgOverlay');
        const bgLoading = document.getElementById('bgLoading');
        const gameOverlay = document.getElementById('gameOverlay');
        const finalScore = document.getElementById('finalScore');
        const finalHits = document.getElementById('finalHits');
        const finalMisses = document.getElementById('finalMisses');
        const finalEficiencia = document.getElementById('finalEficiencia');
        const eficienciaValue = document.getElementById('eficienciaValue');
        const recordInfo = document.getElementById('recordInfo');
        const posInfo = document.getElementById('posInfo');
        const resultTitle = document.getElementById('resultTitle');
        const restartBtn = document.getElementById('restartBtn');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const nameOverlay = document.getElementById('nameOverlay');
        const nameInput = document.getElementById('nameInput');
        const nameBtn = document.getElementById('nameBtn');
        const nameError = document.getElementById('nameError');
        const rankingArea = document.getElementById('rankingArea');

        // ─── CONSTANTES DO JOGO (MANTIDAS) ──────────────────────────
        const START_SIZE = 18;
        const MAX_SIZE = 90;
        const GROWTH_INTERVAL = 30;
        const STAGES = [
            { maxSize: 45, step: 1.62, level: 1 },
            { maxSize: 67.5, step: 2.25, level: 2 },
            { maxSize: 90, step: 3.375, level: 3 }
        ];
        const LEVEL_CONFIG = {
            1: { limit: 20, maxBubbles: 1 },
            2: { limit: 40, maxBubbles: 2 },
            3: { limit: 60, maxBubbles: 3 },
            4: { limit: 80, maxBubbles: 4 },
            5: { limit: 100, maxBubbles: 5 },
        };
        const MAX_LEVEL = 5;

        // ─── ESTADO GLOBAL ──────────────────────────────────────────
        let score = 0;
        let level = 1;
        let hits = 0;
        let misses = 0;
        let levelLimit = 20;
        let maxBubbles = 1;
        let isGameActive = false;
        let gameStarted = false;
        let bubbles = [];
        let bubbleIdCounter = 0;
        let nextSpawnTimer = null;
        let loadingComplete = false;
        let partidaId = null;
        let jogadorId = null;
        let nomeJogador = '';
        let eventoOrdem = 0;
        let startTime = 0;

        // ─── FUNÇÕES AUXILIARES ─────────────────────────────────────
        function random(min, max) { return Math.random() * (max - min) + min; }
        function randomInt(min, max) { return Math.floor(random(min, max + 1)); }
        function getConfig(lv) { return LEVEL_CONFIG[lv] || LEVEL_CONFIG[MAX_LEVEL]; }

        // ─── BACKGROUND ──────────────────────────────────────────────
        function setRandomBackground(callback) {
            const seed = randomInt(1, 999999);
            const w = Math.floor(gameArea.clientWidth || 600);
            const h = Math.floor(gameArea.clientHeight || 600);
            const url = `https://picsum.photos/seed/${seed}/${w}/${h}`;
            bgLoading.style.display = 'block';
            bgOverlay.style.opacity = '0';
            bgOverlay.classList.remove('loaded');
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function () {
                bgOverlay.style.backgroundImage = `url(${url})`;
                bgLoading.style.display = 'none';
                bgOverlay.style.opacity = '0.7';
                bgOverlay.classList.add('loaded');
                if (callback) callback();
            };
            img.onerror = function () {
                bgLoading.style.display = 'none';
                bgOverlay.style.backgroundImage = 'radial-gradient(ellipse at center, #2a4a66, #0b1a2e)';
                bgOverlay.style.opacity = '1';
                bgOverlay.classList.add('loaded');
                if (callback) callback();
            };
            img.src = url;
        }

        // ─── LOADING ──────────────────────────────────────────────────
        function showLoading() {
            loadingOverlay.classList.remove('hidden');
            startOverlay.classList.remove('show');
            gameOverlay.classList.remove('show');
            loadingComplete = false;
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
            loadingComplete = true;
            // Mostra a tela de nome
            nameOverlay.classList.remove('hidden');
            carregarRanking();
        }

        // ─── RANKING ──────────────────────────────────────────────────
        async function carregarRanking() {
            try {
                const { data, error } = await supabase.functions.invoke('obter-ranking');
                if (error) throw error;
                if (!data || data.length === 0) {
                    rankingArea.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:8px;">Nenhum jogador ainda</div>';
                    return;
                }
                let html = '';
                data.forEach((item, idx) => {
                    const isSelf = (jogadorId && item.id === jogadorId);
                    html += `<div class="rank-item${isSelf ? ' self' : ''}">
                                <span class="pos">#${item.posicao}</span>
                                <span class="name">${escapeHtml(item.nome)}</span>
                                <span class="score">${item.recorde}</span>
                             </div>`;
                });
                rankingArea.innerHTML = html;
            } catch (e) {
                rankingArea.innerHTML = '<div style="color:#ef9a9a;text-align:center;padding:8px;">Erro ao carregar ranking</div>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─── SUPABASE: CRIAR JOGADOR ──────────────────────────────
        async function criarJogador(nome) {
            const { data, error } = await supabase
                .from('jogadores')
                .insert({ nome })
                .select('id')
                .single();
            if (error) throw error;
            return data.id;
        }

        // ─── SUPABASE: INICIAR PARTIDA ─────────────────────────────
        async function iniciarPartida(jogador_id) {
            const { data, error } = await supabase.functions.invoke('iniciar-partida', {
                body: { jogador_id }
            });
            if (error) throw error;
            return data.partida_id;
        }

        // ─── SUPABASE: REGISTRAR EVENTO ────────────────────────────
        async function registrarEvento(tipo, dados = {}) {
            if (!partidaId) return;
            const instante = Date.now() - startTime;
            eventoOrdem++;
            try {
                await supabase.functions.invoke('registrar-evento', {
                    body: {
                        partida_id: partidaId,
                        jogador_id: jogadorId,   // <-- ADICIONADO
                        ordem: eventoOrdem,
                        tipo,
                        instante,
                        dados
                    }
                });
            } catch (e) {
                console.warn('Erro ao registrar evento:', e);
            }
        }

        // ─── SUPABASE: FINALIZAR PARTIDA ──────────────────────────
        async function finalizarPartida() {
            if (!partidaId) return null;
            try {
                const { data, error } = await supabase.functions.invoke('finalizar-partida', {
                    body: {
                        partida_id: partidaId,
                        jogador_id: jogadorId   // <-- ADICIONADO
                    }
                });
                if (error) throw error;
                return data;
            } catch (e) {
                console.error('Erro ao finalizar partida:', e);
                return null;
            }
        }

        // ─── LÓGICA DO JOGO (mantida, com adaptações) ──────────────
        function getLevelAndPoints(size) {
            const pct = (size / MAX_SIZE) * 100;
            if (pct <= 50) return { level: 1, points: 1 };
            if (pct <= 75) return { level: 2, points: 2 };
            return { level: 3, points: 3 };
        }

        function createBubbleWrapper() {
            const wrapper = document.createElement('div');
            wrapper.className = 'bubble-wrapper';
            gameArea.appendChild(wrapper);
            const ghost = document.createElement('div');
            ghost.className = 'ghost';
            ghost.style.width = MAX_SIZE + 'px';
            ghost.style.height = MAX_SIZE + 'px';
            wrapper.appendChild(ghost);
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            wrapper.appendChild(bubble);
            return { wrapper, ghost, bubble };
        }

        function spawnBubble() {
            if (!isGameActive || !gameStarted) return;
            const activeCount = bubbles.filter(b => b.active).length;
            if (activeCount >= maxBubbles) return;
            const pos = getSpawnPosition(null);
            const { wrapper, ghost, bubble: bubbleEl } = createBubbleWrapper();
            const id = bubbleIdCounter++;
            wrapper.style.left = pos.x + 'px';
            wrapper.style.top = pos.y + 'px';
            const bubble = {
                id,
                wrapper,
                ghost,
                element: bubbleEl,
                x: pos.x,
                y: pos.y,
                size: START_SIZE,
                active: true,
                growthInterval: null,
                points: 1,
                stageIndex: 0,
            };
            bubbleEl.style.width = START_SIZE + 'px';
            bubbleEl.style.height = START_SIZE + 'px';
            updateBubbleLevel(bubble);
            const handleClick = function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (!bubble.active || !isGameActive) return;
                popBubble(bubble);
            };
            bubbleEl.addEventListener('click', handleClick);
            bubbleEl.addEventListener('touchstart', handleClick, { passive: false });
            bubble.growthInterval = setInterval(() => {
                growBubble(bubble);
            }, GROWTH_INTERVAL);
            bubbles.push(bubble);
            updateUI();
            scheduleNextSpawn();
            // Registra evento
            registrarEvento('BOLHA_CRIADA', { id: bubble.id, x: bubble.x, y: bubble.y });
        }

        function growBubble(bubble) {
            if (!bubble.active || !isGameActive) return;
            let stageIdx = 0;
            if (bubble.size >= STAGES[0].maxSize) stageIdx = 1;
            if (bubble.size >= STAGES[1].maxSize) stageIdx = 2;
            if (stageIdx >= STAGES.length) { burstBubble(bubble); return; }
            const stage = STAGES[stageIdx];
            bubble.size += stage.step;
            const el = bubble.element;
            el.style.width = bubble.size + 'px';
            el.style.height = bubble.size + 'px';
            const rect = gameArea.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            const radius = bubble.size / 2;
            const margin = 2;
            let x = bubble.x;
            let y = bubble.y;
            if (x - radius < margin) x = margin + radius;
            if (x + radius > w - margin) x = w - margin - radius;
            if (y - radius < margin) y = margin + radius;
            if (y + radius > h - margin) y = h - margin - radius;
            bubble.x = x;
            bubble.y = y;
            bubble.wrapper.style.left = x + 'px';
            bubble.wrapper.style.top = y + 'px';
            updateBubbleLevel(bubble);
            if (bubble.size >= MAX_SIZE) {
                burstBubble(bubble);
            }
        }

        function updateBubbleLevel(bubble) {
            const info = getLevelAndPoints(bubble.size);
            bubble.points = info.points;
            const el = bubble.element;
            el.className = 'bubble';
            el.classList.add('nv' + info.level);
            const ghost = bubble.ghost;
            ghost.className = 'ghost';
            ghost.classList.add('nv' + info.level + '-ghost');
        }

        function popBubble(bubble) {
            if (!bubble.active) return;
            bubble.active = false;
            if (bubble.growthInterval) {
                clearInterval(bubble.growthInterval);
                bubble.growthInterval = null;
            }
            const pts = bubble.points;
            score += pts;
            addHit();
            const el = bubble.element;
            el.classList.add('popping');
            showPopupOnBubble(bubble.x, bubble.y, '+' + pts, 'p' + pts);

            // --- ENVIA O NÍVEL DA BOLHA (NÃO OS PONTOS) ---
            const nivelBolha = getLevelAndPoints(bubble.size).level;
            registrarEvento('ACERTO', { nivel_bolha: nivelBolha });  // <-- AQUI

            setTimeout(() => {
                if (bubble.wrapper.parentNode) bubble.wrapper.parentNode.removeChild(bubble.wrapper);
            }, 250);
            const idx = bubbles.indexOf(bubble);
            if (idx !== -1) bubbles.splice(idx, 1);
            updateUI();
            checkAndScheduleSpawn();
        }

        function burstBubble(bubble) {
            if (!bubble.active) return;
            bubble.active = false;
            if (bubble.growthInterval) {
                clearInterval(bubble.growthInterval);
                bubble.growthInterval = null;
            }
            addMiss();
            const el = bubble.element;
            el.classList.add('bursting');
            showPopupOnBubble(bubble.x, bubble.y, '💔', 'lost-heart');
            registrarEvento('ERRO', { tamanho: Math.round(bubble.size) });
            setTimeout(() => {
                if (bubble.wrapper.parentNode) bubble.wrapper.parentNode.removeChild(bubble.wrapper);
            }, 320);
            const idx = bubbles.indexOf(bubble);
            if (idx !== -1) bubbles.splice(idx, 1);
            updateUI();
            checkAndScheduleSpawn();
        }

        function showPopupOnBubble(x, y, text, className) {
            const el = document.createElement('div');
            el.className = 'bubble-popup ' + className;
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            gameArea.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 850);
        }

        function getSpawnDelay() {
            const lv = Math.min(level, MAX_LEVEL);
            if (lv === 1) return 500;
            if (lv === 2) return [500, 750][randomInt(0, 1)];
            if (lv === 3) return [500, 1000][randomInt(0, 1)];
            if (lv === 4) return [500, 1250][randomInt(0, 1)];
            return [500, 1500][randomInt(0, 1)];
        }

        function isValidPosition(x, y, excludeBubble) {
            const radius = MAX_SIZE / 2;
            const margin = 5;
            const minDist = MAX_SIZE + margin;
            for (let b of bubbles) {
                if (!b.active) continue;
                if (excludeBubble && b.id === excludeBubble.id) continue;
                const dx = x - b.x;
                const dy = y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) return false;
            }
            return true;
        }

        function getSpawnPosition(excludeBubble) {
            const rect = gameArea.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            const radius = MAX_SIZE / 2;
            const margin = radius + 5;
            for (let attempt = 0; attempt < 50; attempt++) {
                const x = margin + random(0, w - margin * 2);
                const y = margin + random(0, h - margin * 2);
                if (isValidPosition(x, y, excludeBubble)) {
                    return { x, y };
                }
            }
            return { x: margin + random(0, w - margin * 2), y: margin + random(0, h - margin * 2) };
        }

        function scheduleNextSpawn() {
            if (nextSpawnTimer) {
                clearTimeout(nextSpawnTimer);
                nextSpawnTimer = null;
            }
            if (!isGameActive || !gameStarted) return;
            const activeCount = bubbles.filter(b => b.active).length;
            if (activeCount >= maxBubbles) return;
            if (activeCount === 0) { spawnBubble(); return; }
            const delay = getSpawnDelay();
            nextSpawnTimer = setTimeout(() => {
                if (isGameActive && gameStarted) {
                    const count = bubbles.filter(b => b.active).length;
                    if (count < maxBubbles) spawnBubble();
                    else scheduleNextSpawn();
                }
            }, delay);
        }

        function checkAndScheduleSpawn() {
            if (nextSpawnTimer) {
                clearTimeout(nextSpawnTimer);
                nextSpawnTimer = null;
            }
            const activeCount = bubbles.filter(b => b.active).length;
            if (activeCount === 0 && isGameActive && gameStarted) {
                spawnBubble();
            } else if (activeCount < maxBubbles && isGameActive && gameStarted) {
                scheduleNextSpawn();
            }
        }

        function updateLevel() {
            const cfg = getConfig(level);
            levelLimit = cfg.limit;
            maxBubbles = cfg.maxBubbles;
            limitDisplay.textContent = levelLimit;
            levelBadge.textContent = 'Nível ' + level;
            updateUI();
            reconcileBubbles();
            registrarEvento('NIVEL', { nivel: level, limite: levelLimit, max_bolhas: maxBubbles });
        }

        function advanceLevel() {
            if (level >= MAX_LEVEL) {
                level = MAX_LEVEL;
                const cfg = getConfig(level);
                levelLimit = cfg.limit;
                maxBubbles = cfg.maxBubbles;
                hits = 0;
                misses = 0;
                updateLevel();
                return;
            }
            level++;
            const cfg = getConfig(level);
            levelLimit = cfg.limit;
            maxBubbles = cfg.maxBubbles;
            hits = 0;
            misses = 0;
            updateLevel();
        }

        function addHit() {
            if (!isGameActive) return;
            hits++;
            if (hits >= levelLimit) {
                advanceLevel();
            } else {
                updateUI();
            }
        }

        function addMiss() {
            if (!isGameActive) return;
            misses++;
            if (misses >= levelLimit) {
                // Game over por erro
                gameOver(false);
            } else {
                updateUI();
            }
        }

        function updateProgressBar() {
            const h = Math.min(hits, levelLimit);
            const m = Math.min(misses, levelLimit);
            const pctHits = (h / levelLimit) * 100;
            const pctMisses = (m / levelLimit) * 100;
            progressHits.style.width = Math.min(pctHits, 100) + '%';
            progressMisses.style.width = Math.min(pctMisses, 100) + '%';
            progressHits.classList.remove('front');
            progressMisses.classList.remove('front');
            if (h < m) { progressHits.classList.add('front'); } else if (m < h) { progressMisses.classList.add('front'); } else {
                progressHits
                    .classList.add('front');
            }
        }

        function updateUI() {
            const h = Math.min(hits, levelLimit);
            const m = Math.min(misses, levelLimit);
            hitsCount.textContent = h;
            missesCount.textContent = m;
            scoreDisplay.textContent = score;
            updateProgressBar();
        }

        function reconcileBubbles() {
            const active = bubbles.filter(b => b.active);
            const toRemove = bubbles.filter(b => !b.active);
            toRemove.forEach(b => { if (b.wrapper.parentNode) b.wrapper.parentNode.removeChild(b.wrapper); });
            bubbles = active;
            if (bubbles.length > maxBubbles) {
                const excess = bubbles.length - maxBubbles;
                const toPop = bubbles.slice(0, excess);
                toPop.forEach(b => {
                    if (b.active) {
                        b.active = false;
                        if (b.growthInterval) {
                            clearInterval(b.growthInterval);
                            b.growthInterval = null;
                        }
                        b.element.classList.add('bursting');
                        setTimeout(() => { if (b.wrapper.parentNode) b.wrapper.parentNode.removeChild(b.wrapper); }, 300);
                    }
                });
                bubbles = bubbles.filter(b => b.active);
            }
            if (bubbles.length < maxBubbles && isGameActive && gameStarted) {
                if (bubbles.length === 0) spawnBubble();
                else scheduleNextSpawn();
            }
            updateUI();
        }

        // ─── GAME OVER (modificado) ──────────────────────────────────
        async function gameOver(won) {
            if (!isGameActive) return;
            isGameActive = false;
            if (nextSpawnTimer) {
                clearTimeout(nextSpawnTimer);
                nextSpawnTimer = null;
            }
            bubbles.forEach(b => {
                if (b.growthInterval) {
                    clearInterval(b.growthInterval);
                    b.growthInterval = null;
                }
                b.active = false;
            });

            // Registra evento de fim
            await registrarEvento('GAME_OVER', { vitoria: won, pontuacao: score, acertos: hits, erros: misses });

            // Finaliza partida no servidor
            const resultado = await finalizarPartida();

            // Mostra tela de fim
            finalScore.textContent = score;
            finalHits.textContent = hits;
            finalMisses.textContent = misses;

            if (resultado) {
                finalEficiencia.style.display = 'block';
                eficienciaValue.textContent = resultado.eficiencia || 0;
                if (resultado.novo_recorde) {
                    recordInfo.innerHTML = '🏆 <strong>NOVO RECORDE!</strong> ' + resultado.recorde_atual + ' pontos';
                } else {
                    recordInfo.textContent = '🏆 Seu recorde: ' + (resultado.recorde_atual || 0);
                }
                if (resultado.posicao_ranking) {
                    posInfo.textContent = '📊 Ranking: ' + resultado.posicao_ranking + 'º lugar';
                } else {
                    posInfo.textContent = '';
                }
            } else {
                finalEficiencia.style.display = 'none';
                recordInfo.textContent = '⚠️ Erro ao validar partida';
                posInfo.textContent = '';
            }

            if (won) {
                resultTitle.textContent = '🎉 Vitória!';
                resultTitle.className = 'win';
            } else {
                resultTitle.textContent = '💥 Fim de Jogo';
                resultTitle.className = 'lose';
            }
            gameOverlay.classList.add('show');
        }

        // ─── START / RESTART ─────────────────────────────────────────
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            isGameActive = true;
            startOverlay.classList.remove('show');
            startTime = Date.now();
            spawnBubble();
            scheduleNextSpawn();
            updateUI();
        }

        async function restartGame() {
            // Limpa estado atual
            if (nextSpawnTimer) {
                clearTimeout(nextSpawnTimer);
                nextSpawnTimer = null;
            }
            bubbles.forEach(b => {
                if (b.growthInterval) clearInterval(b.growthInterval);
                if (b.wrapper.parentNode) b.wrapper.parentNode.removeChild(b.wrapper);
            });
            bubbles = [];
            eventoOrdem = 0;
            score = 0;
            level = 1;
            hits = 0;
            misses = 0;
            const cfg = getConfig(level);
            levelLimit = cfg.limit;
            maxBubbles = cfg.maxBubbles;
            gameOverlay.classList.remove('show');
            startOverlay.classList.remove('show');

            // Inicia nova partida no servidor
            try {
                partidaId = await iniciarPartida(jogadorId);
            } catch (e) {
                console.error('Erro ao iniciar partida:', e);
                partidaId = null;
            }

            gameStarted = true;
            isGameActive = true;
            startTime = Date.now();
            updateLevel();
            spawnBubble();
            scheduleNextSpawn();
            setRandomBackground();
            updateUI();
        }

        // ─── FLUXO DE NOME ──────────────────────────────────────────
        async function handleNameSubmit() {
            const nome = nameInput.value.trim();
            if (!nome) {
                nameError.textContent = 'Digite um nome';
                return;
            }
            if (nome.length > 20) {
                nameError.textContent = 'Nome muito longo (máx 20 caracteres)';
                return;
            }
            if (/[<>/]/.test(nome)) {
                nameError.textContent = 'Caracteres inválidos';
                return;
            }
            nameBtn.disabled = true;
            nameError.textContent = '';

            try {
                // Tenta encontrar o jogador pelo nome (exato)
                const { data: existing, error: findErr } = await supabase
                    .from('jogadores')
                    .select('id')
                    .eq('nome', nome)
                    .maybeSingle();

                let id;
                if (existing) {
                    id = existing.id;
                } else {
                    id = await criarJogador(nome);
                }
                jogadorId = id;
                nomeJogador = nome;
                // Esconde tela de nome e mostra start
                nameOverlay.classList.add('hidden');
                // Inicia partida
                partidaId = await iniciarPartida(jogadorId);
                // Mostra start overlay
                startOverlay.classList.add('show');
                // Carrega ranking
                carregarRanking();
                // Salva nome no localStorage
                localStorage.setItem('bolha_nome', nome);
                localStorage.setItem('bolha_jogador_id', id);
            } catch (e) {
                nameError.textContent = 'Erro ao conectar: ' + e.message;
                nameBtn.disabled = false;
            }
        }

        // ─── CARREGAR NOME SALVO ─────────────────────────────────────
        function loadSavedName() {
            const saved = localStorage.getItem('bolha_nome');
            if (saved) {
                nameInput.value = saved;
                // Pode também tentar fazer login automático, mas vamos deixar o usuário clicar
            }
            const savedId = localStorage.getItem('bolha_jogador_id');
            if (savedId) {
                // Tenta usar, mas verifica se ainda existe
                supabase.from('jogadores').select('id').eq('id', savedId).maybeSingle()
                    .then(({ data }) => {
                        if (data) {
                            jogadorId = data.id;
                            nomeJogador = saved || '';
                            // Não pula a tela, mas preenche o campo
                            if (saved) nameInput.value = saved;
                        }
                    }).catch(() => { });
            }
        }

        // ─── RESIZE ────────────────────────────────────────────────────
        let resizeTimeout;

        function handleResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const rect = gameArea.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                bubbles.forEach(b => {
                    if (!b.active) return;
                    const r = b.size / 2;
                    const margin = r + 2;
                    let x = b.x;
                    let y = b.y;
                    let moved = false;
                    if (x - r < margin) {
                        x = margin + r;
                        moved = true;
                    }
                    if (x + r > w - margin) {
                        x = w - margin - r;
                        moved = true;
                    }
                    if (y - r < margin) {
                        y = margin + r;
                        moved = true;
                    }
                    if (y + r > h - margin) {
                        y = h - margin - r;
                        moved = true;
                    }
                    if (moved) {
                        b.x = x;
                        b.y = y;
                        b.wrapper.style.left = x + 'px';
                        b.wrapper.style.top = y + 'px';
                    }
                });
                setRandomBackground();
            }, 300);
        }

        // ─── INIT ────────────────────────────────────────────────────
        function init() {
            showLoading();
            const startTime = Date.now();
            setRandomBackground(function () {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, 2000 - elapsed);
                setTimeout(() => {
                    hideLoading();
                }, remaining);
            });
            setTimeout(() => {
                if (!loadingComplete) hideLoading();
            }, 3000);

            const cfg = getConfig(level);
            levelLimit = cfg.limit;
            maxBubbles = cfg.maxBubbles;
            updateLevel();

            window.addEventListener('resize', handleResize);
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => handleResize());
                ro.observe(gameArea);
            }

            // Eventos
            nameBtn.addEventListener('click', handleNameSubmit);
            nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleNameSubmit(); });
            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startGame();
            }, { passive: false });
            restartBtn.addEventListener('click', restartGame);
            restartBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                restartGame();
            }, { passive: false });

            setInterval(updateUI, 300);

            // Carrega nome salvo
            loadSavedName();
            // Carrega ranking inicial
            carregarRanking();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>

</html>
